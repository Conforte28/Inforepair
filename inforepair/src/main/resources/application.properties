server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework
spring.application.name=inforepair

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inforepair}}
spring.datasource.username=${DB_USERNAME:inforepair}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.max-lifetime=600000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Porto-Novo
spring.jackson.time-zone=Africa/Porto-Novo

spring.thymeleaf.cache=false
spring.mvc.hiddenmethod.filter.enabled=true

app.demo.mode=${DEMO_MODE:false}
app.demo.password=${DEMO_PASSWORD:}
