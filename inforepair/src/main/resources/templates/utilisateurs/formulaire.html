<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: entete(${utilisateur.id == null ? 'Nouvel utilisateur' : 'Modifier l\'utilisateur'})}"></head>
<body>
<div class="app-wrapper">
    <aside th:replace="~{fragments/layout :: menu}"></aside>
    <div class="main-area">
        <header th:replace="~{fragments/layout :: topbar(${utilisateur.id == null ? 'Créer un utilisateur' : 'Modifier l\'utilisateur'})}"></header>
        <main class="content">
            <div th:replace="~{fragments/layout :: messages}"></div>

            <div class="card">
                <form th:action="@{/utilisateurs/enregistrer}" th:object="${utilisateur}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="nomComplet">Nom complet</label>
                            <input type="text" id="nomComplet" th:field="*{nomComplet}" required>
                            <div class="field-error" th:if="${#fields.hasErrors('nomComplet')}" th:errors="*{nomComplet}"></div>
                        </div>

                        <div class="form-group">
                            <label for="email">Adresse électronique (identifiant)</label>
                            <input type="email" id="email" th:field="*{email}" required>
                            <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="form-group">
                            <label for="telephone">Téléphone</label>
                            <input type="text" id="telephone" th:field="*{telephone}">
                        </div>

                        <div class="form-group">
                            <label for="role">Rôle</label>
                            <select id="role" th:field="*{role}" required>
                                <option th:each="r : ${roles}" th:value="${r}" th:text="${r.libelle}"></option>
                            </select>
                            <div class="field-error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
                        </div>

                        <div class="form-group" th:if="${utilisateur.id == null}">
                            <label for="motDePasseClair">Mot de passe initial (min. 6 caractères)</label>
                            <input type="password" id="motDePasseClair" name="motDePasseClair" minlength="6" required>
                        </div>

                        <div class="form-group">
                            <label style="display:flex; align-items:center; gap:8px; margin-top:24px;">
                                <input type="checkbox" th:field="*{actif}" style="width:auto;">
                                Compte actif
                            </label>
                        </div>
                    </div>

                    <div class="actions-row">
                        <button type="submit" class="btn btn-primary">Enregistrer</button>
                        <a th:href="@{/utilisateurs}" class="btn btn-outline">Annuler</a>
                    </div>
                </form>
            </div>

            <div class="card" th:if="${utilisateur.id != null}">
                <div class="card-header"><h2 class="card-title">Réinitialiser le mot de passe</h2></div>
                <form th:action="@{/utilisateurs/{id}/mot-de-passe(id=${utilisateur.id})}" method="post" class="form-grid">
                    <div class="form-group">
                        <label for="nouveauMotDePasse">Nouveau mot de passe (min. 6 caractères)</label>
                        <input type="password" id="nouveauMotDePasse" name="nouveauMotDePasse" minlength="6" required>
                    </div>
                    <div class="form-group" style="display:flex; align-items:flex-end;">
                        <button type="submit" class="btn btn-secondary">Modifier le mot de passe</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
</body>
</html>
