<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: entete('Enregistrer un paiement')}"></head>
<body>
<div class="app-wrapper">
    <aside th:replace="~{fragments/layout :: menu}"></aside>
    <div class="main-area">
        <header th:replace="~{fragments/layout :: topbar('Enregistrer un paiement')}"></header>
        <main class="content">
            <div th:replace="~{fragments/layout :: messages}"></div>

            <div class="card">
                <div class="alert alert-info" th:if="${#lists.isEmpty(reparations)}">
                    Aucune réparation n'est enregistrée pour le moment. Un paiement doit être lié à une réparation issue d'un devis accepté.
                </div>

                <form th:if="${!#lists.isEmpty(reparations)}" th:action="@{/paiements/enregistrer}" method="post">
                    <div class="form-grid">
                        <div class="form-group full">
                            <label for="reparationId">Réparation concernée</label>
                            <select id="reparationId" name="reparationId" required>
                                <option value="">-- Sélectionner une réparation --</option>
                                <option th:each="r : ${reparations}" th:value="${r.id}"
                                        th:selected="${reparationSelectionneeId != null and reparationSelectionneeId == r.id}"
                                        th:text="${r.numeroReparation + ' - ' + r.client.nomComplet + ' (' + r.materiel.numeroDossier + ') | Total dû : ' + @formatUtils.fcfa(r.devis.montantTotal) + ' | Reste : ' + @formatUtils.fcfa(restesParReparation[r.id])}"></option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="datePaiement">Date du paiement</label>
                            <input type="date" id="datePaiement" name="datePaiement"
                                   th:value="${#temporals.format(dateDefaut, 'yyyy-MM-dd')}" required>
                        </div>

                        <div class="form-group">
                            <label for="montant">Montant (FCFA)</label>
                            <input type="number" id="montant" name="montant" min="1" step="1" required
                                   th:value="${resteSelectionne != null ? resteSelectionne.intValue() : ''}">
                        </div>

                        <div class="form-group">
                            <label for="modePaiement">Mode de paiement</label>
                            <select id="modePaiement" name="modePaiement" required>
                                <option th:each="m : ${modesPaiement}" th:value="${m}" th:text="${m.libelle}"></option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="reference">Référence (facultative)</label>
                            <input type="text" id="reference" name="reference" placeholder="Ex: ID transaction Mobile Money, N° reçu">
                        </div>

                        <div class="form-group full">
                            <label for="observation">Observation (facultative)</label>
                            <textarea id="observation" name="observation"></textarea>
                        </div>
                    </div>

                    <div class="actions-row">
                        <button type="submit" class="btn btn-primary">Valider le paiement</button>
                        <a th:href="@{/paiements}" class="btn btn-outline">Annuler</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
</body>
</html>
