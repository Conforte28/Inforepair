<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: entete('Connexion')}"></head>
<body>
<div class="login-page">
    <div class="login-box">
        <div class="login-logo">
            <h1>INFOREPAIR</h1>
            <p th:text="${entreprise.nomEntreprise}">Système de suivi de réparation de matériel informatique</p>
        </div>

        <div th:if="${param.erreur}" class="alert alert-erreur">
            Adresse électronique ou mot de passe incorrect, ou compte désactivé.
        </div>
        <div th:if="${param.deconnexion}" class="alert alert-succes">
            Vous avez été déconnecté.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="email">Adresse électronique</label>
                <input type="email" id="email" name="email" required autofocus>
            </div>
            <div class="form-group">
                <label for="motDePasse">Mot de passe</label>
                <input type="password" id="motDePasse" name="motDePasse" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
        </form>
    </div>
</div>
</body>
</html>
